<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시험 대비 문제은행</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>📘 시험 대비 문제은행</h1>
  </div>
  <p class="subtitle">강의별로 문제를 풀고, 선택하는 즉시 정답·해설을 확인할 수 있어요.</p>

  <div id="grid" class="chapter-grid"></div>
  <footer class="hint">진행 상황은 이 브라우저에만 저장돼요 (localStorage).</footer>
</div>

<script src="assets/common.js"></script>
<script>
async function main() {
  const grid = document.getElementById("grid");
  let manifest;
  try {
    manifest = await loadJson("data/manifest.json");
  } catch (e) {
    grid.innerHTML = `<div class="empty-state">manifest.json을 불러오지 못했어요.<br>${escapeHtml(e.message)}</div>`;
    return;
  }

  grid.innerHTML = manifest.chapters
    .map((ch) => {
      const total = ch.counts ? ch.counts.mc + ch.counts.short + ch.counts.essay : 0;
      if (!ch.available) {
        return `
          <div class="chapter-card disabled">
            <span class="badge-soon">준비중</span>
            <div class="code">${escapeHtml(ch.id)}</div>
            <div class="desc">아직 문제 파일이 등록되지 않았어요.</div>
          </div>`;
      }
      return `
        <a class="chapter-card" href="quiz.html?ch=${encodeURIComponent(ch.id)}">
          <div class="code">${escapeHtml(ch.id)}</div>
          <div class="desc">${escapeHtml(ch.title || "")}</div>
          <div class="meta">
            <span>객관식 ${ch.counts.mc}</span>
            <span>단답 ${ch.counts.short}</span>
            <span>서술 ${ch.counts.essay}</span>
            <span>총 ${total}문항</span>
          </div>
        </a>`;
    })
    .join("");
}
main();
</script>
</body>
</html>
